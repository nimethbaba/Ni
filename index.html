<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NI — Developer portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
:root{
  --bg:#07090d;--surface:#10141b;--surface2:#171c25;--text:#f5f7fa;--muted:#9aa4b2;--line:#252c38;
  --accent:#3b82ff;--accent-ink:#fff;--shadow:0 30px 60px -20px rgba(0,0,0,.7);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--surface:#f4f6fa;--surface2:#fff;--text:#0a0d12;--muted:#566070;--line:#dde2ea;--accent:#1f5eff;--shadow:0 30px 50px -20px rgba(20,40,90,.35)}}
:root[data-theme="light"]{--bg:#fff;--surface:#f4f6fa;--surface2:#fff;--text:#0a0d12;--muted:#566070;--line:#dde2ea;--accent:#1f5eff;--shadow:0 30px 50px -20px rgba(20,40,90,.35)}
:root[data-theme="dark"]{--bg:#07090d;--surface:#10141b;--surface2:#171c25;--text:#f5f7fa;--muted:#9aa4b2;--line:#252c38;--accent:#3b82ff;--shadow:0 30px 60px -20px rgba(0,0,0,.7)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.6 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;padding:.9rem 1.25rem;display:flex;align-items:center;gap:1.25rem}
.logo{font-weight:800;font-size:1.35rem;letter-spacing:-.04em;text-decoration:none;margin-right:auto}
nav{display:flex;gap:.25rem}
nav a{text-decoration:none;color:var(--muted);padding:.45rem .9rem;border-radius:999px;font-weight:500;transition:color .2s,background .2s}
nav a:hover{color:var(--text)}
nav a[aria-current="page"]{color:var(--text);background:var(--surface2);box-shadow:0 0 0 1px var(--line)}
.theme{background:none;border:1px solid var(--line);color:var(--text);width:2.4rem;height:2.4rem;border-radius:50%;cursor:pointer;font-size:1rem}
main{max-width:1100px;margin:0 auto;padding:0 1.25rem 5rem;min-height:70vh}
h1,h2,h3{letter-spacing:-.035em;line-height:1.08;margin:0}
h1{font-size:clamp(2.5rem,7vw,5rem);font-weight:800;max-width:14ch}
h2{font-size:clamp(1.75rem,4vw,2.6rem);font-weight:800}
h3{font-size:1.25rem;font-weight:600;letter-spacing:-.02em}
p{margin:0}
.lead{color:var(--muted);font-size:1.2rem;max-width:46ch;margin-top:1.25rem}
.btn{display:inline-block;text-decoration:none;font:600 1rem var(--font);padding:.85rem 1.5rem;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--text);cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:2rem}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:center;padding:5rem 0 4rem}
.stage{position:relative;height:420px;perspective:1000px}
.layer{position:absolute;background:var(--surface2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:1.1rem 1.25rem;transition:transform .25s ease-out;will-change:transform}
.layer small{color:var(--muted);display:block;margin-bottom:.35rem;font-size:.8rem}
.l1{inset:30px 30px 150px 0;animation:float 7s ease-in-out infinite}
.l2{right:0;top:170px;width:62%;animation:float 8s ease-in-out -2s infinite}
.l3{left:8%;bottom:0;width:58%;animation:float 6s ease-in-out -4s infinite;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.l3 small{color:inherit;opacity:.8}
.code{font:500 .85rem/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.code b{color:var(--accent);font-weight:500}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -14px}}
/* sections */
.sec{padding:3.5rem 0 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.5rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.5rem;display:flex;flex-direction:column;gap:.9rem;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.card p{color:var(--muted);font-size:1rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem}
.tag{font-size:.8rem;padding:.2rem .65rem;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.card .btn{margin-top:auto;align-self:flex-start;padding:.6rem 1.1rem;font-size:.95rem}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem}
.filters button{font:500 .95rem var(--font);background:none;color:var(--muted);border:1px solid var(--line);padding:.45rem 1rem;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.page{padding-top:4rem}
.page>p.lead{margin-bottom:2.5rem}
.about{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
.about ul{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.about li a{display:flex;justify-content:space-between;padding:1rem 1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;font-weight:500;transition:transform .2s,border-color .2s}
.about li a:hover{transform:translateX(6px);border-color:var(--accent)}
.about li span{color:var(--muted)}
.skills{margin-top:1.5rem}
form{display:grid;gap:1.1rem;max-width:560px}
label{display:grid;gap:.4rem;font-weight:500;font-size:.95rem}
input,textarea{font:400 1rem var(--font);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;width:100%}
textarea{min-height:150px;resize:vertical}
.note{color:var(--muted);font-size:.9rem}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer div{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
@media (max-width:820px){
  .hero,.about{grid-template-columns:1fr}.stage{height:360px}.hero{padding-top:3rem}
  .bar{flex-wrap:wrap;gap:.6rem}nav{order:3;width:100%;overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/">NI</a>
  <nav aria-label="Main"><a href="#/work" data-r="work">Work</a><a href="#/about" data-r="about">About</a><a href="#/contact" data-r="contact">Contact</a></nav>
  <button class="theme" id="theme" aria-label="Switch light or dark theme">◐</button>
</div></header>
<main id="app" tabindex="-1"></main>
<footer><div><span id="yr"></span><span>Built by hand. No tracking, no cookies.</span></div></footer>

<script>
/* ===== EDIT ME ===== */
const PROFILE = {
  name: "Nimeth C.",
  email: "nimesiir@gmail.com",
  phone: "9828351409",
  headline: "Hand-coded software that feels weightless.",
  intro: "I’m a solo developer who writes most of my code by hand and uses AI sparingly. I’m looking for an internship with a team that wants a creative coder.",
  links: [
    { label: "GitHub", url: "https://github.com/nimethbaba", note: "Source code" },
    { label: "LinkedIn", url: "https://www.linkedin.com/in/your-handle", note: "Experience" },
    { label: "Email", url: "mailto:nimesiir@gmail.com", note: "nimesiir@gmail.com" },
    { label: "Phone", url: "tel:9828351409", note: "9828351409" }
  ],
  skills: ["C++", "JavaScript", "HTML & CSS", "Python", "Strapi", "Git"]
};
/* Works: replace "file" with a real download path, or set STRAPI_URL to load from Strapi (Collection "works":
   title, description, tags (JSON), category, file (media)). */
const STRAPI_URL = "";
let WORKS = []; // loaded from works.json (or Strapi if STRAPI_URL is set)
/* ==================== */
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#yr").textContent = "© " + new Date().getFullYear() + " " + PROFILE.name;

const list=a=>a.length?a.map(card).join(""):`<p class="note">No projects to show yet.</p>`;
function card(w){
  return `<article class="card"><h3>${esc(w.title)}</h3><p>${esc(w.description)}</p>
  <div class="tags">${(w.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
  ${w.file ? `<a class="btn" href="${esc(w.file)}" download>Download files</a>` : `<span class="note">Download coming soon</span>`}</article>`;
}
const views = {
  home(){
    return `<section class="hero"><div><h1>${esc(PROFILE.headline)}</h1><p class="lead">${esc(PROFILE.intro)}</p>
      <div class="row"><a class="btn primary" href="#/work">See my work</a><a class="btn" href="#/contact">Get in touch</a></div></div>
      <div class="stage" id="stage" aria-hidden="true">
        <div class="layer l1" data-d="18"><small>main.cpp</small><div class="code"><b>class</b> Parking {<br>&nbsp;&nbsp;<b>void</b> login();<br>&nbsp;&nbsp;<b>void</b> save();<br>};<br>// written by hand</div></div>
        <div class="layer l2" data-d="34"><small>Download</small><strong>template.zip</strong></div>
        <div class="layer l3" data-d="50"><small>Open to</small><strong>Internships</strong></div>
      </div></section>
      <section class="sec"><div class="head"><h2>Selected work</h2><a class="btn" href="#/work">All work</a></div>
      <div class="grid">${list(WORKS.slice(0,3))}</div></section>`;
  },
  work(){
    const cats = ["All", ...new Set(WORKS.map(w=>w.category).filter(Boolean))];
    return `<section class="page"><h1>Work</h1><p class="lead">Programs and templates. Download the files and use them.</p>
      <div class="filters" role="group" aria-label="Filter work">${cats.map((c,i)=>`<button aria-pressed="${i==0}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <div class="grid" id="works">${list(WORKS)}</div></section>`;
  },
  about(){
    return `<section class="page"><h1>About</h1><p class="lead">${esc(PROFILE.intro)}</p>
      <div class="about"><div><h2>Skills</h2><div class="tags skills">${PROFILE.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div></div>
      <div><h2 style="margin-bottom:1.25rem">Find me</h2><ul>${PROFILE.links.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(l.label)}</b><span>${esc(l.note)}</span></a></li>`).join("")}</ul></div></div></section>`;
  },
  contact(){
    return `<section class="page"><h1>Contact</h1><p class="lead">Send a message and it opens in your email app, addressed to me.</p>
      <form id="f"><label>Your name<input name="n" required autocomplete="name"></label>
      <label>Your email<input name="e" type="email" required autocomplete="email"></label>
      <label>Message<textarea name="m" required></textarea></label>
      <div><button class="btn primary" type="submit">Send email</button></div>
      <p class="note">Or write directly to <a href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a> or call <a href="tel:${esc(PROFILE.phone)}">${esc(PROFILE.phone)}</a>.</p></form></section>`;
  }
};
function bind(r){
  if(r==="work") document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const c=b.dataset.c; $("#works").innerHTML=list(WORKS.filter(w=>c==="All"||w.category===c));
  });
  if(r==="contact") $("#f").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);
    location.href=`mailto:${PROFILE.email}?subject=${encodeURIComponent("Portfolio message from "+d.get("n"))}&body=${encodeURIComponent(d.get("m")+"\n\nReply to: "+d.get("e"))}`;};
  if(r==="home"){const st=$("#stage");if(st&&!matchMedia("(prefers-reduced-motion:reduce)").matches)
    st.parentElement.onmousemove=e=>{const b=st.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;
      st.querySelectorAll(".layer").forEach(l=>{const d=+l.dataset.d;l.style.transform=`translate(${x*d}px,${y*d}px) rotateY(${x*8}deg) rotateX(${-y*8}deg)`});};}
}
function route(){
  const r = (location.hash.replace("#/","")||"home"), v = views[r]?r:"home";
  app.innerHTML = views[v](); bind(v);
  document.querySelectorAll("nav a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.r===v)||a.removeAttribute("aria-current"));
  document.querySelectorAll("nav a[aria-current]").forEach(a=>a.setAttribute("aria-current","page"));
  document.title = (v==="home"?"":v[0].toUpperCase()+v.slice(1)+" — ")+PROFILE.name+" · Developer portfolio";
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);
$("#theme").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()==="#07090d";d.dataset.theme=dark?"light":"dark";};
(async()=>{
  try{
    if(STRAPI_URL){
      const j=await (await fetch(STRAPI_URL+"/api/works?populate=*")).json();
      WORKS=j.data.map(x=>{const a=x.attributes||x;return{title:a.title,description:a.description,tags:a.tags||[],category:a.category,
        file:a.file&&(a.file.data?STRAPI_URL+a.file.data.attributes.url:a.file.url?STRAPI_URL+a.file.url:"")}});
    } else {
      WORKS=await (await fetch("works.json")).json();
    }
  }catch(e){console.warn("Could not load projects:",e);}
  route();
})();
</script>
</body>
</html>
